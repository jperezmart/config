# No catalog here. This repo *publishes* the ranges the other repos catalog, so
# every range is written out explicitly in each package.json. A `catalog:` entry
# is resolved away at publish time, which is exactly the trap the vendored copies
# fell into: they inherited a catalog this repo does not have.
packages:
  - 'packages/*'

# pnpm's supply-chain policy, pinned rather than inherited, and exempting the
# packages this owner publishes. This block is contract item 10 of
# jperezmart/package-template, copied verbatim and not tailored per repo; the
# README there carries the four things the keys do not say for themselves.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@jperezmart/*'
  - ts-devtools-plugin-radix-themes
  - tw-preset-radix
