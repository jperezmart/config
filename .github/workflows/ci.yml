# SCAFFOLDING — a starting point, not canon. Unlike release.yml, nothing is
# bound to this filename: rename it, rewrite it, or delete it entirely.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json # reads devEngines.runtime
          cache: pnpm

      # CI does not publish: no id-token, no registry-url.
      - run: pnpm install --frozen-lockfile

      # The template's `build` and `typecheck` steps are deleted, not stubbed:
      # this repo ships its files as they are and has no TypeScript sources.
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
